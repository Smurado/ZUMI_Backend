version: '3.8'

services:
  app:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Development  # Hier auf Development stellen für bessere Fehleranzeige
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mydatabase;Port=5432;Username=myuser;Password=mypassword;Include Error Detail=true
      - ASPNETCORE_URLS=http://+:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16
    container_name: postgres_db_local
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    volumes:
      # WICHTIG: Wir laden hier die LOCAL config
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - app-network

  # Certbot lassen wir hier KOMPLETT weg, brauchen wir lokal nicht.

volumes:
  postgres_data_local:

networks:
  app-network:
    driver: bridge