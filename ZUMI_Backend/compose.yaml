version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:80"  # Oder "8000:80" für Konsistenz mit Django
    volumes:
      - .:/app  # Optional: Für Hot-Reload in Dev, aber in .NET oft nicht nötig
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mydatabase;Port=5432;Username=myuser;Password=mypassword;Include Error Detail=true
    depends_on:
      - postgres
    networks:
      - app-network
    restart: always
    # Optional: Wenn du ein wait-Script hast, passe an; sonst Migrationen manuell ausführen
    # command: /app/wait_for_db_and_populate.sh

  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge