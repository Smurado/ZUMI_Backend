events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        #server_name _;
        server_name zumi.community www.zumi.community;
        
        # Für Certbot Validierung
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Alles andere -> HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # HTTPS Block: Hier spielt die Musik
    server {
        listen 443 ssl;
        server_name zumi.community www.zumi.community;

        # Zertifikate
        ssl_certificate /etc/letsencrypt/live/www.zumi.community/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.zumi.community/privkey.pem;

        # Sicherheit
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # HIER passiert der Reverse Proxy
            # Wir leiten an den Container "app" auf Port 8080
            proxy_pass http://app:8000;
            
            # Header weiterreichen, damit die App die echte User-IP kennt
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}